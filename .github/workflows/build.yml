name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Tampilkan error
        if: failure()
        shell: bash
        run: |
          set +e
          set +o pipefail
          A=$(grep -E '^e: ' build.log | sed -E 's#file:///home/runner/work/[^/]+/[^/]+/##' | sort -u | head -5 | tr '\n' ' ' | cut -c1-1200)
          B=$(grep -A10 'What went wrong' build.log | head -14 | tr '\n' ' ' | cut -c1-1500)
          C=$(grep -E 'Duplicate class|Could not|Manifest merger|AAPT|R8:|Unsupported' build.log | sort -u | head -4 | tr '\n' ' ' | cut -c1-900)
          echo "::error::KOTLIN: $A"
          echo "::error::GRADLE: $B"
          echo "::error::LAIN: $C"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: GameSpace-APK
          path: app/build/outputs/apk/debug/*.apk
